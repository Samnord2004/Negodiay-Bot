name: Desktop Build (.exe and Universal macOS .dmg)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Платформа для сборки (mac, win, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mac
          - win
      mac_runner:
        description: 'Сервер сборки macOS (если один из пулов занят)'
        required: false
        default: 'macos-latest'
        type: choice
        options:
          - macos-latest
          - macos-14
          - macos-15
          - macos-15-intel
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. MACOS UNIVERSAL BUILD JOB (.dmg для Apple Silicon M1-M4 + Intel)
  # =========================================================================
  build-macos:
    name: Сборка Universal macOS (.dmg)
    runs-on: ${{ inputs.mac_runner || 'macos-latest' }}
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'mac'

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Установка зависимостей проекта (включая Electron)
        run: npm install

      - name: Сборка веб-приложения и сервера
        run: npm run build

      - name: Сборка универсального установщика macOS (.dmg Apple Silicon + Intel)
        run: npx electron-builder --mac --universal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Загрузка готового образа macOS (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: Negodyai-macOS-Universal-dmg
          path: dist-electron/*.dmg

      - name: Создание GitHub Release (при наличии тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 2. WINDOWS BUILD JOB (.exe)
  # =========================================================================
  build-windows:
    name: Сборка Windows (.exe)
    runs-on: windows-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'win'

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Установка зависимостей проекта (включая Electron)
        run: npm install

      - name: Сборка веб-приложения и сервера
        run: npm run build

      - name: Сборка установщика Windows (.exe)
        run: npx electron-builder --win

      - name: Загрузка готового установщика Windows (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Negodyai-Windows-Setup-exe
          path: dist-electron/*.exe

      - name: Создание GitHub Release (при наличии тега v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
