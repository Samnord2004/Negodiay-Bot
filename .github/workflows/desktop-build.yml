name: Сборка десктопных приложений (.exe и .dmg)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Сборка для ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_name: Negodyai-Windows-Setup.exe
          - os: macos-latest
            target: mac
            artifact_name: Negodyai-macOS.dmg

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Настройка Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка веб-приложения и сервера
        run: npm run build

      - name: Сборка десктопного установщика (${{ matrix.target }})
        run: npx electron-builder --${{ matrix.target }}

      - name: Загрузка артефактов сборки
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: dist-electron/*.*

      - name: Создание GitHub Release (при наличии git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-electron/*.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
