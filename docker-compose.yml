version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://${POSTGRES_USER:-negodyai_user}:${POSTGRES_PASSWORD:-negodyai_secret_pass}@postgres:5432/${POSTGRES_DB:-negodyai_db}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-negodyai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negodyai_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-negodyai_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negodyai_user} -d ${POSTGRES_DB:-negodyai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  app_data:
